<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chunkify Player theming</title>
    <style>
      body { max-width: 70rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; background: #f8fafc; color: #172033; }
      .players { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 2rem; }
      article { padding: 1rem; border: 1px solid #d7deea; border-radius: 1rem; background: white; }
      chunkify-player { width: 100%; aspect-ratio: 16 / 9; }
      .brand-player {
        border-radius: 18px;
      }
      .brand-player { --media-object-fit: cover; }
      .brand-player::part(theme) {
        --media-range-bar-color: #c4b5fd;
        --media-range-track-background: rgb(46 16 101 / 0.35);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@chunkify/player": "../../packages/player/dist/index.js",
          "hls-video-element": "../../node_modules/hls-video-element/dist/hls-video-element.js",
          "custom-media-element": "../../node_modules/custom-media-element/dist/custom-media-element.js",
          "media-tracks": "../../node_modules/media-tracks/dist/index.js",
          "hls.js/": "../../node_modules/hls.js/",
          "media-chrome": "../../node_modules/media-chrome/dist/index.js",
          "media-chrome/": "../../node_modules/media-chrome/"
        }
      }
    </script>
  </head>
  <body>
    <h1>Player theming</h1>
    <p>Both players use the bundled default theme.</p>
    <div class="players">
      <article>
        <h2>Default</h2>
        <chunkify-player src="../../tests/fixtures/media/master.m3u8"
          poster="../../tests/fixtures/media/poster.jpg" controls muted playsinline>
          <track default kind="metadata" label="thumbnails"
            src="../../tests/fixtures/media/thumbnails.vtt" />
        </chunkify-player>
      </article>
      <article>
        <h2>Customer branding</h2>
        <chunkify-player class="brand-player"
          primary-color="#700cd4" secondary-color="#bb1111" accent-color="#cf2626"
          style="--pip-button: none"
          src="../../tests/fixtures/media/master.m3u8"
          poster="../../tests/fixtures/media/poster.jpg" controls muted playsinline>
          <track default kind="metadata" label="thumbnails"
            src="../../tests/fixtures/media/thumbnails.vtt" />
        </chunkify-player>
      </article>
    </div>
    <script type="module">
      import "@chunkify/player";
    </script>
  </body>
</html>
