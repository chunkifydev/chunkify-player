<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chunkify Player</title>
    <style>
      body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; }
      chunkify-player { width: 100%; aspect-ratio: 16 / 9; margin: 1rem 0; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@chunkify/player": "../../packages/player/dist/index.js",
          "hls-video-element": "../../node_modules/hls-video-element/dist/hls-video-element.js",
          "custom-media-element": "../../node_modules/custom-media-element/dist/custom-media-element.js",
          "media-tracks": "../../node_modules/media-tracks/dist/index.js",
          "hls.js/": "../../node_modules/hls.js/",
          "media-chrome": "../../node_modules/media-chrome/dist/index.js",
          "media-chrome/": "../../node_modules/media-chrome/"
        }
      }
    </script>
  </head>
  <body>
    <h1>Chunkify Player</h1>
    <p>The component chooses HLS playback for the manifest and displays the default controls. Use the captions control to switch between sample English and French captions.</p>
    <chunkify-player
      src="../../tests/fixtures/media/master.m3u8"
      poster="../../tests/fixtures/media/poster.jpg"
      controls muted playsinline>
      <track kind="captions" srclang="en" label="English (sample)"
        src="../../tests/fixtures/media/captions-en.vtt" />
      <track kind="captions" srclang="fr" label="Français (exemple)"
        src="../../tests/fixtures/media/captions-fr.vtt" />
      <track default kind="metadata" label="thumbnails"
        src="../../tests/fixtures/media/thumbnails.vtt" />
    </chunkify-player>
    <p id="module-status" role="status">Loading player package...</p>
    <script type="module">
      import "@chunkify/player";
      document.querySelector("#module-status").textContent = "Player package loaded.";
    </script>
  </body>
</html>
